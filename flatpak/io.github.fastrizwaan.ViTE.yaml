app-id: io.github.fastrizwaan.ViTE
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: vite
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.gtk.vfs
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --filesystem=xdg-documents
  - --share=network
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DBUILD_STATIC=0"
    cleanup:
      - "/bin"
      - "/share/man"
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: fast_float
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DFASTFLOAT_TEST=OFF
    cleanup:
      - /lib/cmake
    sources:
      - type: git
        url: https://github.com/fastfloat/fast_float.git
        # SHA256 for verification (Optional but recommended)
        tag: v8.2.3
        
  - name: simdutf
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DSIMDUTF_BENCHMARKS=OFF
      - -DSIMDUTF_TESTS=OFF
      - -DSIMDUTF_TOOLS=OFF
    cleanup:
      - /lib/cmake
    sources:
      - type: git
        url: https://github.com/simdutf/simdutf.git
        # SHA256 for verification (Optional but recommended)
        tag: v8.0.0
        
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=false        # Disable GTK3 build to save time/space
      - -Dgtk4=true         # Enable GTK4 build (Critical for your request)
      - -Dgir=true          # Build GObject Introspection (needed for Python/JS bindings)
      - -Dvapi=true         # Build Vala bindings
      - -Ddocs=false
      - -Dgnutls=true       # Enable GnuTLS support
      - -D_systemd=false    # Disable systemd integration for Flatpak portability
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        tag: 0.83.91         # Check for the latest stable tag suitable for your needs
        commit: d7a9ed902b9d97e657ec095e0bbc0127de9e7746 # Always pin the commit for reproducibility
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/gir-1.0
      - /share/vala
                                
  - name: vite
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    sources:
      - type: dir
        path: ..
